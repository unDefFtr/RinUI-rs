name: Validate release source
description: Resolve a version tag on the default branch and check out its exact commit
inputs:
  tag:
    description: Existing release tag
    required: true
outputs:
  commit:
    description: Peeled commit SHA
    value: ${{ steps.checkout.outputs.commit }}
  version:
    description: Cargo workspace version
    value: ${{ steps.checkout.outputs.version }}
runs:
  using: composite
  steps:
    - name: Resolve and validate release tag
      id: checkout
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.tag }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        EVENT_SHA: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
          echo "Expected a v-prefixed SemVer tag without build metadata" >&2
          exit 1
        fi
        if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
          echo "Run the workflow on the default branch and supply the existing version tag" >&2
          exit 1
        fi
        commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
        git merge-base --is-ancestor "$commit" HEAD || {
          echo "Release commit must already be on $DEFAULT_BRANCH" >&2
          exit 1
        }
        if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]]; then
          if [[ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" || "$(git rev-parse "$EVENT_SHA^{commit}")" != "$commit" ]]; then
            echo "The tag no longer matches the event commit" >&2
            exit 1
          fi
        fi
        git checkout --detach "$commit"
        git submodule update --init --recursive
        python3 scripts/release.py source "$RELEASE_TAG" "$commit"
