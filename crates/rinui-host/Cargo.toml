[package]
name = "rinui-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
readme = "README.md"
links = "rinui-host"
description = "Rust-native host and bindings for RinUI (Qt Quick/QML)"
include = [
    "/build.rs",
    "/src/",
    "/native/",
    "/vendor/",
    "/examples/",
    "/tests/",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY_NOTICES.md",
]

[features]
default = []
qt-widgets-test = []

[dependencies]
rinui-platform = { workspace = true }
cxx = { workspace = true }
cxx-qt = { workspace = true }
cxx-qt-lib = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
cc = "1"
cxx-qt-build = { workspace = true }
qt-build-utils = { workspace = true }

[dev-dependencies]
tempfile = "3"
tracing-subscriber = { workspace = true }

[[test]]
name = "embedded_runtime"
harness = false

[[test]]
name = "filesystem_dev_mode"
harness = false

[[test]]
name = "hardening"
harness = false

[[test]]
name = "i18n_semantics"
harness = false

[[test]]
name = "runtime_sessions"
harness = false

[[test]]
name = "core_app_rejection"
harness = false

[[test]]
name = "object_interop"
harness = false

[[test]]
name = "parity_review_regressions"
harness = false

[[test]]
name = "external_qapplication"
harness = false
required-features = ["qt-widgets-test"]
