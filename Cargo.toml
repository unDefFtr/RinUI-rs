[workspace]
resolver = "2"
members = [
    "crates/rinui-platform",
    "crates/rinui-host",
    "examples/gallery",
]

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/unDefFtr/rinui-rs"
homepage = "https://rinui-rs.undef.work/"
documentation = "https://rinui-rs.undef.work/"

[workspace.dependencies]
rinui-platform = { version = "0.1.0-alpha.1", path = "crates/rinui-platform" }
rinui-host = { version = "0.1.0-alpha.1", path = "crates/rinui-host" }
cxx = "1.0"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["qt_full"] }
cxx-qt-build = "0.10.0"
qt-build-utils = "0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
